<!doctype html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .mask-logo {
    background-color: #0d9b4a;
    -webkit-mask-image: url("/militrin-logo.png");
    mask-image: url("/militrin-logo.png");
    mask-mode: luminance;
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
</style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(13,155,74,0.14),_transparent_38%),radial-gradient(circle_at_bottom_right,_rgba(13,155,74,0.08),_transparent_45%),linear-gradient(180deg,_#020617,_#0b1220)] p-8 text-slate-100">
  <div class="flex gap-6">
    <aside class="w-80 rounded-[2rem] border border-slate-800/80 bg-slate-950/65 p-5">
      <div class="flex items-center gap-3 border-b border-slate-800/80 pb-4">
        <div class="mask-logo h-12 w-12 shrink-0"></div>
        <div>
          <p class="text-xs uppercase tracking-[0.24em] text-green-300">Militrin</p>
          <h1 class="text-xl font-semibold">Minha conta</h1>
        </div>
      </div>
      <a class="mt-4 flex items-center justify-between rounded-2xl border border-green-400/50 bg-green-500/15 px-4 py-3 font-semibold text-green-100">Painel administrativo</a>
      <a class="mt-2 flex items-center justify-between rounded-2xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-slate-200">Início</a>
    </aside>
    <section class="relative isolate flex-1 overflow-hidden rounded-[2rem] border border-slate-800/80 bg-slate-900/70 p-6">
      <div class="mask-logo pointer-events-none absolute -right-14 -top-12 -z-10 h-80 w-80 rotate-6 opacity-25"></div>
      <p class="text-xs uppercase tracking-[0.22em] text-green-300">Dashboard</p>
      <h2 class="mt-2 text-3xl font-semibold text-white">Olá, Douglas!</h2>
      <p class="mt-2 text-sm text-slate-300">Bem-vindo à sua conta Militrin.</p>
      <button class="mt-4 inline-flex h-11 items-center justify-center gap-2 rounded-2xl bg-white px-4 text-sm font-semibold text-slate-900 shadow-lg shadow-black/20">Ver QR Code</button>
      <button class="ml-3 mt-4 inline-flex h-11 items-center justify-center gap-2 rounded-2xl border border-slate-700 bg-slate-900/70 px-4 text-sm font-semibold text-slate-100">Ver compras</button>
    </section>
  </div>

  <div class="mt-10 flex items-center gap-6">
    <div class="mask-logo h-16 w-16"></div>
    <div class="mask-logo h-40 w-40 opacity-30"></div>
    <p class="text-xs text-slate-400 max-w-xs">Comparação: badge pequeno (64px) e watermark maior com opacidade reduzida, ambos mascarados na mesma cor verde bandeira.</p>
  </div>
</body>
</html>
